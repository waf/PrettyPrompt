# On pushing a tag like v5.0.1, publish to nuget.org and create a GitHub release.
# Use publish-release.ps1 to push a release.
name: release

on:
  push:
    tags:
    - "v[0-9]+.*" # not a regex! ".*" means a period followed by any character https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#filter-pattern-cheat-sheet

permissions:
  contents: write # needed to create the GitHub release
  id-token: write # needed for NuGet Trusted Publishing (GitHub OIDC token -> short-lived NuGet API key)

jobs:
  build:

    runs-on: windows-latest

    # Must match the "Environment" field of the nuget.org Trusted Publishing policy. The environment's
    # protection rules in GitHub (Settings > Environments > release) only allow v* tags, so a modified
    # copy of this workflow on some other branch can't publish.
    environment: release

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Dotnet
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: '11.0.x'

    - name: Dotnet Installation Info
      run: dotnet --info

    - name: Pack
      run: dotnet pack ./src/PrettyPrompt/PrettyPrompt.csproj -c Release -p:ContinuousIntegrationBuild=true

    # Exchange this job's GitHub OIDC token for a nuget.org API key (Trusted Publishing).
    # The key is valid for 1 hour, so request it after packing, right before pushing.
    - name: NuGet login
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ secrets.NUGET_USER }} # nuget.org profile name, not email

    - name: Publish to NuGet
      run: dotnet nuget push --skip-duplicate --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source 'https://api.nuget.org/v3/index.json' .\src\PrettyPrompt\bin\Release\PrettyPrompt.*.nupkg

    # Pull the notes for this version straight out of CHANGELOG.md so the GitHub release
    # mirrors what's already curated there (CHANGELOG.md is the single source of truth).
    - name: Extract release notes from CHANGELOG
      shell: pwsh
      run: |
        $version = '${{ github.ref_name }}'.TrimStart('v')
        $changelog = Get-Content -Raw CHANGELOG.md
        $escaped = [regex]::Escape($version)
        $match = [regex]::Match($changelog, "(?ms)^# Release $escaped[ \t]*\r?\n(.*?)(?=\r?\n# Release |\z)")
        if (-not $match.Success) {
            Write-Error "Could not find a '# Release $version' section in CHANGELOG.md"
            exit 1
        }
        Set-Content -Path release-notes.md -Value $match.Groups[1].Value.Trim()

    - name: Create GitHub release
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file release-notes.md --verify-tag
